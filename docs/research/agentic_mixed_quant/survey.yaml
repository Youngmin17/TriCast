directions:
  - title: "가산 민감도 표 + 정확 할당"
    papers: [zeroq-cvpr20, adaquant-icml21, higgs-naacl25, hill-arxiv26, modeloptaq-github26, hawqv3-icml21]
    summary: "층 하나만 섭동한 손실을 가산하고 예산 아래 DP/ILP/MCKP 로 푼다. 2020년 CNN 비트폭에서 시작해 LLM(HIGGS) · 제품 코드(ModelOpt kl_div) · 순위 보존 이론(Hill)까지 왔다. C2 의 뼈대는 여기서 선점됐다."
  - title: "가산성의 붕괴와 상호작용 · 블랙박스 탐색"
    papers: [evopress-icml25, amq-emnlp25, brecq-iclr21, clado-dac25, coopq-acl26, autopruner-arxiv26]
    summary: "교차 항 · 비가산성을 보이고 진화 · NSGA-II · Shapley 로 보정한다. 블랙박스는 측정을 많이 쓴다(AMQ 약 1만 회)."
  - title: "층별 방법 · 형식 혼합"
    papers: [calm-arxiv25, modeloptaq-github26, mxmoe-icml25, autoscheme-github25, kvtuner-icml25]
    summary: "층마다 GPTQ/AWQ/SQ 나 포맷을 고른다. 공간은 각자 좁다(방법 3개, 포맷 몇 개, KV 만). 회전 · 희소 · 방법 옵션까지 한 공간에 넣은 사례는 없다."
  - title: "LLM 에이전트 압축"
    papers: [explorerreviewer-openreview26, autoqs-openreview26, haqa-arxiv26, apqf-arxiv26, kodathala-arxiv26, autopruner-arxiv26]
    summary: "2026년에 급증했다. 대부분 arXiv · 심사 중이고, 한 축(비트 · group size · 희소율 · 전역 하이퍼파라미터)만 다루며, 같은 측정 수 블랙박스 비교가 드물다."
  - title: "LLM-as-optimizer 의 평가 관행"
    papers: [zhang-arxiv23, llambo-iclr24, airadojo-neurips25, mlagentbench-icml24, reevo-neurips24, helionllm-blog26]
    summary: "등예산 any-time 곡선, BO/TPE · LLM-seeded BO 기준선, 무이력 · 무검색 arm, 선택 편향, 비용 표가 표준이다. 예산에 따라 우열이 뒤집힌다."
gaps:
  - title: "층별 이질 공간에서 해석적 · 블랙박스와의 등측정 비교"
    claims: [C1, C3]
    evidence: [hill-arxiv26, haqa-arxiv26, autoqs-openreview26, calm-arxiv25]
    summary: "LLM 에이전트 압축 문헌에는 Linear 단위 방법 × 형식 × 옵션 배정을 가산 배낭 · 진화 · BO 와 같은 측정 수로 비교한 tier-1 사례가 없다. Hill 의 N=300 프로토콜과 ModelOpt · EvoPress 를 기준선으로 쓰면 이 자리를 실험으로 채울 수 있다."
  - title: "같은 실행 안의 측정 원장을 id 로 인용하게 하는 결정적 검사"
    claims: [C1]
    evidence: [mlagentbench-icml24, mlrbench-neurips25, mlcopilot-eacl24, pcn-arxiv25, autopruner-arxiv26]
    summary: "에이전트의 근거 없는 주장(~20%) · 조작(~80%) 문제가 보고됐고, 검색은 과제 간 경험에 머문다. 최적화 루프 안에서 인용 id 실존 · 수치 지지를 결정적으로 거르는 장치는 찾지 못했다. 다만 explorerreviewer 본문은 unknown 이다."
  - title: "가산 표가 틀리는 곳을 측정 피드백으로 고치기"
    claims: [C1, C2]
    evidence: [hill-arxiv26, clado-dac25, evopress-icml25, autopruner-arxiv26]
    summary: "고립 민감도는 구성 손실을 크게 잘못 가격 매긴다(71–376%). 표 + 배낭을 시작점으로 두고 측정 이력으로 상호작용을 고치는 것이 에이전트가 기여할 자리다. 저예산(낮은 비트)일수록 비가산성이 커진다는 가설을 측정해야 한다."
verdict: >-
  C2(단일 층 KL 표 + 가산 + 정확 할당)는 핵심이 선점됐다(ZeroQ 2020, HIGGS, ModelOpt kl_div, Hill). 논문 기여가 아니라 강한 기준선으로
  다뤄야 한다. C3(이질적 층별 공간)는 부분 선점이다(CALM 의 방법 3개 혼합, ModelOpt 의 포맷 + AWQ/SQ). 공간의 폭(회전 · NF4/HQQ/RaZeR ·
  N:M · KV · 방법 옵션)과 Linear 단위만 남는다. H1("방법 혼합 > 비트 혼합")은 CALM Tab 4 가 이미 보였으므로 주장에서 내린다.
  신규성은 C1 에 있다: 측정 원장 인용 + 결정적 수치 검사를 받는 LLM 이 층별 이질 공간에서, 같은 측정 수로 Hill 식 배낭 · ModelOpt ·
  EvoPress · AMQ · TPE · LLM-seeded BO 보다 낫다는 것. 이를 선점한 문헌은 찾지 못했다. 가장 큰 위험은 동시기 ICLR'27 제출물 두 편
  (AutoQS, Explorer–Reviewer)이고 본문 미확인이다. 그다음 위험은 실험 결과 자체다: LLM 우위는 예산에 따라 뒤집힐 수 있고(zhang-arxiv23),
  직접 프롬프팅은 층별 할당이 불안정하다는 보고(TAP)가 있다.
