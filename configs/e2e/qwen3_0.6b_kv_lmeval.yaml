# Qwen3-0.6B, KIVI caches on a generation task in cache mode (deployment path): each CoQA prompt
# is prefilled in full precision and only generated tokens read the quantized cache (tricast.kv).
# The adapter evaluates KV recipes one request per forward (lm-eval pads without a mask).
model: Qwen/Qwen3-0.6B
dtype: bfloat16
device: cuda
seed: 42
native_baseline: true
tasks:
  lm_eval: {tasks: [coqa], batch_size: 1}
recipes:
  - kivi2_kv
  - name: kivi4_kv
    description: KIVI 4-bit keys and values with native linear layers and residual length 128.
    defaults: {}
    include: []
    kv: {preset: kivi4, mode: cache}
output_dir: ../../runs/e2e/qwen3_0.6b_kv_lmeval
