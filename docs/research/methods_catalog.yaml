# TriCast method catalog: LLM quantization / sparsity methods and their official-code entry points.
# Provenance (2026-11-03):
#   - repo/license/last_push: GitHub REST `repos/{owner}/{repo}` (license.spdx_id, pushed_at = any branch). Redirects resolved
#     (mobiusml/hqq -> dropbox/hqq, quic/aimet -> qualcomm/aimet, mit-han-lab/deepcompressor -> nunchux-ai/deepcompressor,
#     NVIDIA/TensorRT-Model-Optimizer -> NVIDIA/Model-Optimizer, CASIA-IVA-Lab/FLAP -> CASIA-LMC-Lab/FLAP).
#     license "none" = GitHub detects no LICENSE file (all rights reserved by default).
#   - entry: read from a depth-1 clone of the default branch (source only, never executed). file:symbol + signature as in source.
#   - deps_conflict: only pins visible in requirements*/setup.py/pyproject/README vs torch 2.8 + transformers 4.55.
#   - arxiv: confirmed against export.arxiv.org titles; venue: KB card, arXiv comment, or README badge.
#     A note "venue: prior knowledge" marks venues not re-verified in this pass.
#   - pip: only packages whose PyPI project URL points to the official repo (or is named in the official README).
# tricast_fit legend:
#   per_layer_callable  official symbol works on one Linear weight (+ calib stats) / one K,V tensor / one activation.
#                       An entry marked "(metric inline)" is classified model_script: its scoring expression exists only
#                       inside the whole-model function, and copying it would be a re-implementation (user rule
#                       2026-10-30) — TriCast calls the official whole-model function instead (src/tricast/official).
#   model_script        official code runs only as whole-model script / model-specific traversal or patched modeling file.
#   kernel_or_system    effect requires custom CUDA/Triton kernels or an inference engine.
#   training            QAT / fine-tuning / learned masks, rotations, gates needing gradient training.
#   no_official_code    no official repo found.
# TriCast status field (added 2026-11-03 in this repository): tricast = official_adapter | verified_against_official |
#   tricast_native | tricast_reimplementation | tricast_partial | none (support_matrix.yaml is the status source).
checked: 2026-11-03
methods:

