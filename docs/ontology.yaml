# TriCast 미니 도메인 온톨로지 (강의 2 산출물)
#
# 상태 (2026-10-01): evidence 는 docs/research/interviews.md 의 로그 번호(B절)와 관찰 번호(C절, A1·A2).
# 대표어는 코드 식별자·AGENTS.md 용어집과 같다. 인터뷰에서 쓴 말(같은 문서 E절의 클래스 이름 포함)은
# synonyms 에 적어 대표어 하나로 모은다. 세부 속성 가운데 인터뷰에 직접 나오지 않고 공개 작업물에서 온 것은
# 관찰 번호를 근거로 쓴다.
# evidence: [] = 코드에는 있지만 로그·관찰로 역추적되지 않는 항목 — Format.special, QuantSpec.zero_point·observer,
# MMASpec.promote_interval, Recipe.transform·weight_algo·kv, EmulationRequest 전체. 강의 2 규칙(역추적되지 않는
# 항목은 두지 않는다)에 따라 근거가 생기지 않으면 확정 전에 삭제한다 (팀 결정 대기).
# 규칙: relations 의 대상은 이 파일에 정의된 클래스여야 한다.
version: 2
classes:
  User:
    description: 저정밀 모델이나 연산기를 설계·검증하는 연구자와 엔지니어
    synonyms: [연구자, ML 엔지니어, NPU 개발자]
    evidence: [로그 1, 로그 3, 로그 9, 로그 10]
    attributes:
      role: {type: enum, values: [quantization_researcher, npu_engineer, llm_optimization_researcher],
             evidence: [로그 1, 로그 3, 로그 9, 로그 10]}
    relations:
      - writes: Recipe
        evidence: [로그 1, 로그 10]
      - runs: EvalRun
        evidence: [로그 1, 로그 9, 로그 10]
  Format:
    description: 값의 격자를 정하는 수 형식 — float(ExMy), int(고정소수점 포함), power-of-two(E8M0)
    synonyms: [NumericFormat, 수치 형식, bit 수, 비트 폭, FP8, INT8]
    evidence: [로그 1, 로그 3, 로그 10, 관찰 A2]
    attributes:
      name: {type: string, examples: [fp8_e4m3, fp6_e3m2, fp4_e2m1, bf16, int8, e8m0], evidence: [로그 3, 관찰 A2]}
      kind: {type: enum, values: [float, int, pow2], evidence: [로그 3, 관찰 A2]}
      bits: {type: int, examples: [8, 6, 4], evidence: [로그 1, 로그 10]}
      special: {type: enum, values: [ieee, fn, fnuz, none], note: "Inf/NaN 인코딩 방식", evidence: []}
  QuantSpec:
    description: 텐서 하나(가중치 또는 활성)를 Format 격자에 사상하는 방법
    synonyms: [양자화 설정, scaling 방법]
    evidence: [로그 1, 관찰 A2]
    attributes:
      granularity: {type: enum, values: [tensor, row, group, block], evidence: [관찰 A2]}
      group_size: {type: int, examples: [16, 32, 128], note: "MX=32, NVFP4=16", evidence: [관찰 A2]}
      scale.method: {type: enum, values: [absmax, pow2_floor, pow2_ceil, mse, percentile], evidence: [로그 1, 관찰 A2]}
      rounding: {type: enum, values: [rne, rna, rtz, rup, rdn, sr], evidence: [로그 9, 관찰 A2]}
      zero_point: {type: enum, values: [none, int, float], evidence: []}
      observer: {type: enum, values: [minmax, ema, history, percentile, mse], note: "정적 활성 스케일의 amax 출처",
                 evidence: []}
    relations:
      - uses: Format
        evidence: [로그 1, 관찰 A2]
  MMASpec:
    description: 행렬 곱셈 유닛이 내적을 누산하는 산술 — 정렬·절단·라운딩·누산기 결합 방식
    synonyms: [연산 알고리즘, 누산 방식, arithmetic_algorithm]
    evidence: [로그 9, 로그 10, 관찰 A1]
    attributes:
      algorithm: {type: enum, values: [cofda, gdfs, fp32_fma, fp64, int_exact], evidence: [로그 9, 관찰 A1]}
      f_bits: {type: int, note: "누산 데이터패스 소수 비트 F", evidence: [관찰 A1]}
      chunk_size: {type: int, note: "CoFDA 한 번에 융합되는 곱의 수 CS", evidence: [관찰 A1]}
      c_mode: {type: enum, values: [fused, decoupled], note: "누산기 C 가 절단 경로에 들어가는지", evidence: [관찰 A1]}
      g_bits: {type: int, note: "GDFS 그룹 내부 비트 G — f_bits 와 다른 축", evidence: [관찰 A1]}
      norm_rounding: {type: enum, values: [rne, rtz], evidence: [로그 9, 관찰 A1]}
      promote_interval: {type: int, note: "이 K 간격마다 부분합을 fp32 로 승격 (출처: DeepSeek-V3 보고서)", evidence: []}
  Preset:
    description: 실제 하드웨어(GPU 세대·NPU)의 MMASpec 과 그 출처·검증 상태
    synonyms: [HardwareEnvironment, GPU 세대, 하드웨어 지원]
    evidence: [로그 3, 로그 9, 관찰 A1]
    attributes:
      name: {type: string, examples: [nvidia_hopper_fp8, nvidia_blackwell_fp4], evidence: [로그 3, 관찰 A1]}
      provenance: {type: string, note: "출처 없는 프리셋은 두지 않는다", evidence: [관찰 A1]}
    relations:
      - is_a: MMASpec
        evidence: [관찰 A1]
  Recipe:
    description: 한 번의 에뮬레이션 구성 — 레이어별 가중치·활성 QuantSpec, MMASpec, 희소성, 이상치 보존, 변환
    synonyms: [EmulationConfig, 에뮬레이션 설정, 설계 조합]
    evidence: [로그 1, 로그 9, 로그 10, 관찰 A1]
    attributes:
      name: {type: string, evidence: [관찰 A1]}
      sparsity: {type: dict, note: "n:m 또는 비율(unstructured) — 가중치에 적용", evidence: [로그 10]}
      outliers: {type: dict, note: "크기 상위 비율의 가중치를 고정밀 형식으로 따로 보존", evidence: [로그 10]}
      transform: {type: enum, values: [none, hadamard, random_hadamard, smoothquant, awq], evidence: []}
      weight_algo: {type: enum, values: [rtn, gptq], evidence: []}
      kv: {type: dict, note: "KV 캐시 양자화 — preset, mode, layers", evidence: []}
    relations:
      - quantizes_with: QuantSpec
        evidence: [로그 1, 관찰 A1]
      - accumulates_with: MMASpec
        evidence: [로그 9, 관찰 A1]
  Model:
    description: 평가 대상 Hugging Face 모델 (저장소 id + commit SHA)
    synonyms: [모델]
    evidence: [로그 1, 로그 2, 로그 3]
    attributes:
      repo_id: {type: string, examples: [Qwen/Qwen3-0.6B], evidence: [관찰 A1]}
      revision: {type: string, note: "재현성 — commit SHA", evidence: [로그 1]}
  EvalRun:
    description: Recipe 를 Model 에 적용해 과제 하나를 평가한 기록 — 지표와 환경
    synonyms: [Experiment, Measurement, 실험, 측정 결과]
    evidence: [로그 1, 로그 2, 로그 3, 로그 9, 로그 10]
    attributes:
      task: {type: string, examples: [wikitext2_ppl, hellaswag, coqa], evidence: [로그 2, 관찰 A1]}
      metrics: {type: dict, note: "정확도(PPL·lm-eval), 레이어 오차(MSE·SQNR), 누산기 ULP 오차",
                evidence: [로그 2, 로그 9, 로그 10]}
      env: {type: dict, note: "git SHA, 버전, 실행한 GPU, 모델·데이터셋 식별자", evidence: [로그 1, 로그 9]}
    relations:
      - applies: Recipe
        evidence: [로그 1, 로그 10]
      - evaluates: Model
        evidence: [로그 1, 로그 2]
  EmulationRequest:
    description: 사용자가 말로 적은 설정 변경을 구조화한 결과 (구조화 출력의 대상, 강의 3)
    synonyms: [자연어 요청]
    evidence: []
    attributes:
      intent: {type: enum, values: [evaluate, compare, sweep, explain, inspect, report], evidence: []}
      assumptions: {type: list, note: "요청에 없어서 기본값으로 채운 항목", evidence: []}
    relations:
      - requests: Recipe
        evidence: []
      - targets: Model
        evidence: []
# 범위 밖(명시): ONNX 등 배포 형식 변환과 실제 디바이스 실행(로그 2 — 페인 2는 다루지 않는다),
#               칩 면적·전력 추정(로그 9·10 의 목표지만 출처 없는 하드웨어 수치는 만들지 않는다 — AGENTS.md 규칙 2),
#               클라우드·데이터센터 운영, 모델 서비스 배포, CUDA 커널 자동 생성 (interviews.md E절),
#               RTL 생성, 대규모 학습(QAT 는 STE 수준만), attention QKᵀ·PV matmul 에뮬레이션(현재)
# 핵심 흐름: User --(writes)--> Recipe --(적용)--> Model --(평가)--> EvalRun --(근거 인용)--> 설정 선택
