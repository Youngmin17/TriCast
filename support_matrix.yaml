# TriCast support matrix — the single source of implementation status (AGENTS.md §7).
#
# status:
#   verified     test evidence on the named backend (evidence names the test and the run)
#   implemented  code + CPU tests; the named backend is not yet verified end to end
#   planned      not implemented
# Update this file in the same change that moves a cell; never mark "verified" without evidence.

updated: 2026-10-01

backends:
  reference:
    status: verified
    evidence: "pytest --ignore=tests/gpu: Linux x86_64 torch 2.8.0 (UCL cluster) 2337 passed at 82db449, after
      six tests that compared native CPU results bit for bit (BLAS/SDPA rounding by shape) got tolerances
      for those native parts only (9a2680b); macOS arm64 torch 2.11: the affected test files (483 tests)
      passed at 82db449, the full suite at an earlier commit. On CUDA tensors the reference equals the CPU
      bit for bit since 9e9bfed (tests/gpu/test_reference_cuda.py, A100 and V100); before, torch.ldexp
      made rare casts differ and every reference GEMM raise on CUDA"
  triton_quantize:
    status: verified
    evidence: "tests/gpu/test_triton_quantize.py bit-exact vs reference (A100 sm_80 and V100 sm_70, triton 3.4.0)"
  triton_mma:
    status: verified
    evidence: "tests/gpu/test_triton_mma.py bit-exact vs reference (A100 and V100; whole GPU suite 896 passed at 9e9bfed);
      bench_mma_vs_nadpe.py bit-identical to NADPE on full-size GEMMs; small-M kernel: GPU suite 845 passed at
      cc0478b on A100 and V100 (incl. tests/gpu/test_triton_gemv.py), all 1716 NADPE vectors on A100 and V100,
      Qwen3-0.6B decode logits of 9 recipes identical to the tiled kernel; lm-eval hopper_fp8_w8a8 (HellaSwag 2000,
      CoQA 500) rerun at b68addd reproduces every metric of the 5c09f47 run"
    performance: "A100: CoFDA F=13 0.15 TMAC/s (NADPE 0.15), GDFS G=6 0.15, GDFS G=32 0.11 (NADPE 0.16);
      Qwen3-0.6B Hopper-FP8 decode step (M=1, scripts/bench/bench_decode.py, 032684b and cc0478b alternated
      twice on one GPU): V100 375-401 -> 168-170 ms; A100 292-294 -> 101 ms (host load ~95 on 128 CPUs)"

