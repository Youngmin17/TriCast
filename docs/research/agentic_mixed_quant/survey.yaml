idea:
  thesis: >-
    측정 기록 원장(ledger)을 근거로 읽고 결정적 검사(크기 예산 · 인용한 레코드 id 실존 · 수치가 인용 레코드로 지지됨)를 통과해야 하는 LLM
    에이전트가 Linear 단위의 이질적 방법 × 형식 × 옵션 공간에서 배정을 제안하고, 같은 전체 모델 측정 수에서 가산 표 + 정확 배낭과
    블랙박스 탐색보다 낮은 KL 의 레시피를 찾는다.
  claims:
    - {id: C1, text: "원장 검색 + 결정적 타입 검사 + LLM 의 층별 혼합 방법 배정 제안이, 같은 측정 수에서 해석적(배낭) · 블랙박스(랜덤 · 진화 · BO) 탐색보다 낫다"}
    - {id: C2, text: "층 하나만 양자화한 end-to-end KL 표(patch floor 차감) + 저장 비트 예산 아래 정확 MCKP 가 좋은 시작점을 준다"}
    - {id: C3, text: "GPTQ · AWQ · SmoothQuant · 회전 · NVFP4/MX/INT8/BFP · NF4/HQQ/RaZeR · N:M · KV 를 한 층별 공간에서 고른다"}
