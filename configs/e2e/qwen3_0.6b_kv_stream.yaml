# Cross-check of qwen3_0.6b_kv.yaml: the same KIVI caches in cache mode, streamed one token at a
# time through the cache (the deployment path) on the first 8 WikiText-2 windows.
# KV-only recipes retain native linears. KIVI (ICML 2024), Algorithm 1:
# https://proceedings.mlr.press/v235/liu24bz.html
# ENGINE.md §3.13: channel keys flush at R, token values retain R; attend before writing.
model: Qwen/Qwen3-0.6B
dtype: bfloat16
device: cuda
seed: 42
native_baseline: true
tasks:
  ppl: {dataset: wikitext2, seqlen: 2048, max_windows: 8, streaming: true}
recipes:
  - kivi2_kv
  - name: kivi4_kv
    description: KIVI 4-bit keys and values with native linear layers and residual length 128.
    defaults: {}
    include: []
    kv: {preset: kivi4, mode: cache}
output_dir: ../../runs/e2e/qwen3_0.6b_kv_stream
