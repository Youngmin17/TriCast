integration:
  hf_patch: {status: implemented, note: "nn.Linear -> EmuLinear; lm_head excluded by default"}
  conv2d_patch:
    status: verified
    backends: [reference, triton]
    note: "Opt-in include_conv2d=True; unfold -> one EmuLinear per group. Inference-only, dynamic quantization,
      RTN weights; no transforms, GPTQ, observers, custom Conv2d subclasses or module-local hooks.
      Public Parameters/state_dict names and aliases are preserved; unpatch restores the original modules.
      SR caches survive whole-module deepcopy/pickle, but are not part of a plain state_dict.
      This is an explicit reduction order, not cuDNN algorithm or native Tensor Core convolution parity"
    evidence: "scripts/e2e/validate_model_families.py: 40 convolution cases (8 geometries x 5 recipes),
      all finite and bit-identical to independent matrix lowering (max_diff=0, bypass_detected=false),
      plus 11 contract guards on geneva CPU reference, berlin H200 NVL GPU 1 and geneva A100 GPU 0,
