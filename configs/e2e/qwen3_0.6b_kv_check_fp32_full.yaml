# fp32 model, first 2 WikiText-2 windows: fakequant (one causal forward). Pair of
# qwen3_0.6b_kv_check_fp32_stream.yaml; in fp32 the two KV paths must agree to rounding, which bf16
# (qwen3_0.6b_kv_check.yaml vs qwen3_0.6b_kv_stream.yaml, 0.1%) cannot show.
model: Qwen/Qwen3-0.6B
dtype: float32
device: cuda
seed: 42
native_baseline: true
tasks:
  ppl: {dataset: wikitext2, seqlen: 2048, max_windows: 2}
recipes:
  - name: kivi2_fakequant
    description: KIVI 2-bit keys and values, residual 128, every token read as a decode step.
    defaults: {}
    include: []
    kv: {preset: kivi2, mode: fakequant}
output_dir: ../../runs/e2e/qwen3_0.6b_kv_check_fp32_full
