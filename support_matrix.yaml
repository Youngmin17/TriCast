weight_structure:
  sparsity: {status: verified, values: ["n:m", unstructured], source: "team interviews, log 10",
             note: "magnitude pruning after the transform, before quantization; dense K order in the accumulator
               (hardware that compresses N:M operands may chunk differently: not modeled); inference only, not with gptq",
             evidence: "tests/test_sparsity_outliers.py (CPU); tests/gpu/test_triton_structure.py reference = Triton
               bit for bit (A100, V100)"}
  outliers: {status: verified, values: [fraction, format], source: "team interviews, log 10; SpQR arXiv:2306.03078",
             note: "largest |w| kept in a float format beside the quantized weight, added through an fp32 FMA path
               and rounded once; magnitude selection (not SpQR's sensitivity); inference only, not with gptq",
             evidence: "tests/test_sparsity_outliers.py (CPU); tests/gpu/test_triton_structure.py (A100, V100)"}
