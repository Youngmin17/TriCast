# FP8 with activation scales from the preceding amax history.
# Source: Transformer Engine delayed scaling; ENGINE.md §3.11.
name: fp8_delayed_history
description: FP8 with activation scales from the preceding amax history.
defaults:
  weight: fp8_tensor
  activation: fp8_tensor_delayed
  mma: nvidia_hopper_fp8
  transform: none
  weight_algo: rtn
include:
- '*'
exclude:
- lm_head
backend: auto
calibration:
  dataset: wikitext2
  split: train
  samples: 128
  seqlen: 2048
  seed: 42
