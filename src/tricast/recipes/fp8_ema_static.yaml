# FP8 weights and calibrated EMA per-tensor activation scales.
# Source: ENGINE.md §3.11 EMA observer.
name: fp8_ema_static
description: FP8 weights and calibrated EMA per-tensor activation scales.
defaults:
  weight: fp8_tensor
  activation: fp8_tensor_ema
  mma: nvidia_hopper_fp8
  transform: none
  weight_algo: rtn
include:
- '*'
exclude:
- lm_head
backend: auto
calibration:
  dataset: wikitext2
  split: train
  samples: 128
  seqlen: 2048
  seed: 42
