# GPTQ UINT4 group-128 weights, zero points, and unquantized activations.
# Source: GPTQ; BF16 tensor-core assumption (CoFDA F=23 CS=32) is unverified.
name: w4a16_g128_zp_gptq
description: GPTQ UINT4 group-128 weights, zero points, and unquantized activations.
defaults:
  weight: int4_g128_zp
  activation: null
  mma:
    algorithm: cofda
    f_bits: 23
    chunk_size: 32
  transform: none
  weight_algo: gptq
include:
- '*'
exclude:
- lm_head
backend: auto
calibration:
  dataset: wikitext2
  split: train
  samples: 128
  seqlen: 2048
  seed: 42
