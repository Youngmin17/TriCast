# Qwen3-0.6B, full WikiText-2 test perplexity (GPTQ convention: 2048-token windows).
# native is the unpatched model; bf16_passthrough must match it (SPEC AC4).
# Part B of two: block-scaled formats (MX, NVFP4, BFP), transforms and GPTQ.
model: Qwen/Qwen3-0.6B
dtype: bfloat16
device: cuda
seed: 42
native_baseline: true
tasks:
  ppl: {dataset: wikitext2, seqlen: 2048}
recipes: [mxfp8_w_a, mxfp6_w_a, mxfp4_w_a, mxfp4_rht, msfp12_bfp, nvfp4_w_a, nvfp4_4o6,
  nvfp4_smoothquant, nvfp4_awq_shared, mixed_first_last_bf16, w4a16_g128_zp_gptq,
  w4a16_gptq_sequential]
output_dir: ../../runs/e2e/qwen3_0.6b_ppl_b
